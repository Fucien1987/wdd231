<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Family Z Services LLC Provides bookkeeping and business support Services for individuals and small business.">
    <meta name="author" content="Kerlando Fucien">
    <meta property="og:title" content="Family Z Services LLC">
    <meta Property="og:description"
        content="Professional bookkeeping and business support made simple.">
    <meta property="og:type" content="website">

    <title>Family Z Services LLC | Contact</title>
    <link rel="stylesheet" href="styles/project.css">
</head>
<body>
    <header>
        <div class="brand">
            <span class="logo">FZ</span>
            <span>Family Z Services LLC</span>
        </div>
        <button id="menu-button" aria-label="Open navigation menu">
            &#9776
        </button>
        <nav id="navigation">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Thank You!</h1>
            <p>
                Your request has been submitted successfully.
                Family Z Services LLC will get back to you soon.
            </p>
            <h2>Request Information</h2>
            <div id="form-results" class="button"></div>
            <a href="index.html">Return Home</a>
        </section>
    </main>
    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Family Z Services LLC
        </p>
        <p>
            <a href="attributions.html">Attributions</a>
        </p>
        <p id="lastModified"></p>
    </footer>
    <script type="module" src="scripts/main.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);

        const firstName = params.get("firstName");
        const lastName = params.get("lastName");
        const email = params.get("email");
        const service = params.get("service");
        const message = params.get("message");

        document.querySelector("#form-results").innerHTML = `
            <p><strong>Name:</strong> ${firstName} ${lastName}</p>
            <p><strong>Email:</strong> ${email}</p>
            <p><strong>Service:</strong> ${service}</p>
            <p><strong>Message:</strong> ${message}</p>
        `;
    </script>
</body>
</html>
