<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Family Z Services LLC Provides bookkeeping and business support Services for individuals and small business.">
    <meta name="author" content="Kerlando Fucien">
    <meta property="og:title" content="Family Z Services LLC">
    <meta Property="og:description"
        content="Professional bookkeeping and business support made simple.">
    <meta property="og:type" content="website">

    <title>Family Z Services LLC | Contact</title>
    <link rel="stylesheet" href="styles/project.css">
</head>
<body>
    <header>
        <div class="brand">
            <span class="logo">FZ</span>
            <span>Family Z Services LLC</span>
        </div>
        <button id="menu-button" aria-label="Open navigation menu">
            &#9776
        </button>
        <nav id="navigation">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Contact Family Z Services</h1>
            <p>
                Have a question or need assistance? Complete the form below
                and we will get back to you.
            </p>
            <form method="get" action="form-action.html">
                <label>
                    First Name
                    <input type="text" name="firstName" required>
                </label>
                <label>
                    Last Name
                    <input type="text" name="lastName" required>
                </label>
                <label>
                    Email
                    <input type="email" name="email" required>
                </label>
                <label>
                    Service Needed
                    <select name="service" required>
                        <option value="">Select a service</option>
                        <option value="bookkeeping">bookkeeping</option>
                        <option value="business-support">Business-Support</option>
                        <option value="document-services">Document Services</option>
                    </select>
                </label>
                <label>
                    Message
                    <textarea name="message" rows="6" required></textarea>
                </label>
                <button type="submit">Send Request</button>
            </form>
        </section>
    </main>
    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Family Z Services LLC
        </p>
        <p>
            <a href="attributions.html">Attributions</a>
        </p>
        <p id="lastModified"></p>
    </footer>
    <script type="module" src="scripts/main.js"></script>
</body>
</html>
